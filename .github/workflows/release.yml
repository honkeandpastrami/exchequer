# Every merge to main is a release (docs/deployment.md): it picks the next
# version from the merged pull requests' labels (deploy/release-version), tags
# the merge commit vX.Y.Z, builds both images, smoke-tests them, publishes them
# to GitHub's container registry as X.Y.Z, X.Y and latest, creates a GitHub
# Release with the Python packages and the CLI's .deb attached, has
# honkeandpastrami/debian-repo publish that .deb, and updates the CLI's formula
# in honkeandpastrami/homebrew-tap. Nothing in the repo holds
# the version: every build takes it from the tag (deploy/version, hatch-vcs).
# The tag is pushed only once everything is built and tested, so a failed run
# leaves nothing behind, and running it again picks the same version.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Pick the version and tag it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(deploy/release-version)
          if [ -z "$(git tag --points-at HEAD --list "v$version")" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "v$version" -m "v$version"
          fi
          test "$(deploy/version)" = "$version" ||
              { echo "deploy/version says $(deploy/version), not $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "MINOR=${version%.*}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The server image's layers, the compiled dependencies above all, kept in
      # GitHub's cache. Every workflow reads and writes one scope; a tag can read
      # what main wrote.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: exchequer-server
          build-args: EXCHEQUER_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-2-Clause
          cache-from: type=gha,scope=exchequer-server
          cache-to: type=gha,mode=max,scope=exchequer-server
      - name: Build the backup image
        run: |
          labels=(--label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
                  --label "org.opencontainers.image.version=$VERSION"
                  --label "org.opencontainers.image.revision=$GITHUB_SHA"
                  --label "org.opencontainers.image.licenses=BSD-2-Clause")
          docker build -f deploy/backup.Containerfile "${labels[@]}" -t exchequer-backup deploy
      - name: Smoke test
        run: deploy/tests/image-smoke.sh exchequer-server exchequer-backup "$VERSION"
      - name: Build the Python packages
        working-directory: python
        run: |
          uv build --package exchequer-sdk --out-dir dist
          uv build --package exchequer-cli --out-dir dist
          uv build --package firefly-migrate --out-dir dist
          # Their version comes from the tag too (hatch-vcs).
          ls dist/*"-$VERSION-"*.whl
      - name: Build and smoke-test the CLI's Debian package
        run: |
          deb=$(deploy/build-cli-deb)
          test "$deb" = "python/dist/exchequer-cli_${VERSION}_all.deb"
          deploy/tests/cli-deb-smoke.sh "$deb"
      # What the CLI's Homebrew formula installs from; the python workflow
      # tests the formula on pull requests (deploy/tests/cli-formula-smoke.sh).
      - name: Build the Python workspace's source tarball
        run: test "$(deploy/build-python-source)" = "python/dist/exchequer-python-$VERSION.tar.gz"
      - name: Push the tag
        run: git push origin "v$VERSION"
      - name: Publish images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in exchequer-server exchequer-backup; do
              for tag in "$VERSION" "$MINOR" latest; do
                  docker tag "$image" "$REGISTRY/$image:$tag"
                  docker push -q "$REGISTRY/$image:$tag"
              done
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" python/dist/* --verify-tag --generate-notes \
              --title "Exchequer $VERSION" \
              --notes "Images: \`$REGISTRY/exchequer-server:$VERSION\`, \`$REGISTRY/exchequer-backup:$VERSION\`."
      # debian-repo rebuilds the apt repository from releases, this one included.
      - name: Update the apt repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: gh api repos/honkeandpastrami/debian-repo/dispatches -f event_type=release
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          tarball=python/dist/exchequer-python-$VERSION.tar.gz
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/${tarball##*/}"
          tap="$RUNNER_TEMP/homebrew-tap"
          gh auth setup-git
          git clone -q https://github.com/honkeandpastrami/homebrew-tap.git "$tap"
          deploy/exchequer-cli-formula "$tarball" "$url" "$VERSION" > "$tap/Formula/exchequer-cli.rb"
          # Add first: commit with a path skips a file git doesn't track yet.
          git -C "$tap" add Formula/exchequer-cli.rb
          git -C "$tap" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "exchequer-cli $VERSION"
          git -C "$tap" push -q
