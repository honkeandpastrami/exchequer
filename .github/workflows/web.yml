# The web app: lint, types, tests, licences, build, and the generated API
# types matching api/openapi.json. Runs `just web-check`, the same command
# used locally.
name: web

on:
  push:
    branches: [main]
    paths: &paths
      - web/**
      - api/**
      - justfile
      - .github/workflows/web.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just web-check
