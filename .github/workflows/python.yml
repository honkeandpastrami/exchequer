# The Python workspace: lint, types, tests, licences, and the generated SDK
# matching api/openapi.json. Runs `just python-check`, the same command used
# locally.
name: python

on:
  push:
    branches: [main]
    paths: &paths
      - python/**
      - api/**
      - justfile
      - deploy/build-cli-deb
      - deploy/tests/cli-deb-smoke.sh
      - .github/workflows/python.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just python-check

  # The CLI's Debian package, as the release builds it, installed on Debian 13.
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: deploy/tests/cli-deb-smoke.sh "$(deploy/build-cli-deb)"
