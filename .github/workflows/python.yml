# The Python workspace: lint, types, tests, licences, and the generated SDK
# matching api/openapi.json. Runs `just python-check`, the same command used
# locally.
name: python

on:
  push:
    branches: [main]
    paths: &paths
      - python/**
      - api/**
      - justfile
      - deploy/build-cli-deb
      - deploy/tests/cli-deb-smoke.sh
      - .github/workflows/python.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: just python-check

  # The CLI's Debian package, as the release builds it, installed on Debian 13.
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: deploy/tests/cli-deb-smoke.sh "$(deploy/build-cli-deb)"
