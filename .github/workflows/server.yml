# The Rust server: format, lints, licenses, tests, backup round trip, and the
# container image. Runs `just check`, the same command used locally.
name: server

on:
  push:
    branches: [main]
    paths: &paths
      - server/**
      - api/**
      - deploy/**
      - justfile
      - Containerfile
      - .dockerignore
      - .github/workflows/server.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          # A throwaway database that only the job can reach: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The justfile's database settings point here instead of server/.pgdata.
      EXCHEQUER_PGHOST: localhost
      EXCHEQUER_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v5
      - name: Install Postgres 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install sqlx-cli
        working-directory: server
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Apply migrations
        working-directory: server
        run: cargo sqlx migrate run -D postgres://exchequer@localhost/exchequer
      - run: just check

  image:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build -f Containerfile -t exchequer-server .
          docker build -f deploy/backup.Containerfile -t exchequer-backup deploy
      - name: Smoke test
        run: |
          docker run --rm exchequer-server schema-version
          docker run -d --name api --network host \
            -e DB_HOST=localhost -e DB_USER=exchequer -e DB_NAME=exchequer \
            -e EXCHEQUER_BIND=127.0.0.1:8080 exchequer-server
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/version
          docker logs api
          test "$(docker inspect -f '{{.State.Running}}' api)" = true
          docker run --rm exchequer-backup sh -c 'command -v exchequer-backup && pg_dump --version && pg_restore --version'
