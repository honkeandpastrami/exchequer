# The Rust server: format, lints, licenses, tests, backup round trip, and the
# container image. Runs `just check`, the same command used locally.
name: server

on:
  push:
    branches: [main]
    paths: &paths
      - server/**
      - api/**
      - deploy/**
      - web/**
      - justfile
      - Containerfile
      - .dockerignore
      - .github/workflows/server.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          # A throwaway database that only the job can reach: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The justfile's database settings point here instead of server/.pgdata.
      EXCHEQUER_PGHOST: localhost
      EXCHEQUER_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v5
      - name: Install Postgres 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install sqlx-cli
        working-directory: server
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Apply migrations
        working-directory: server
        run: cargo sqlx migrate run -D postgres://exchequer@localhost/exchequer
      - run: just check

  image:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: echo "VERSION=$(deploy/version)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      # The server image's layers, the compiled dependencies above all, kept in
      # GitHub's cache. Every workflow reads and writes one scope; a tag can read
      # what main wrote.
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: exchequer-server
          build-args: EXCHEQUER_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=exchequer-server
          cache-to: type=gha,mode=max,scope=exchequer-server
      - name: Build the backup image
        run: docker build -f deploy/backup.Containerfile -t exchequer-backup deploy
      - name: Smoke test
        run: deploy/tests/image-smoke.sh exchequer-server exchequer-backup
