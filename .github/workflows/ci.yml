# Every check, for a pull request, for it on top of main in the merge queue,
# and again on main after the merge. Each area
# (server, web, python) runs only when its paths changed; `gate` passes only if
# nothing that ran failed, and it's the one check the ruleset requires. Each
# area runs the same `just` recipe as a local checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which areas this change touches. A change to this file runs them all, and
  # so does a push whose previous commit is unknown.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.areas.outputs.server }}
      web: ${{ steps.areas.outputs.web }}
      python: ${{ steps.areas.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$BASE...HEAD")
          else
              files=.github/workflows/ci.yml
          fi
          printf '%s\n' "$files"
          touches() { grep -qE "^(\.github/workflows/ci\.yml|$1)" <<< "$files" && echo true || echo false; }
          {
              echo "server=$(touches 'server/|api/|deploy/|web/|justfile$|Containerfile$|\.dockerignore$')"
              echo "web=$(touches 'web/|api/|justfile$')"
              echo "python=$(touches 'python/|api/|justfile$|deploy/build-cli-deb$|deploy/tests/cli-deb-smoke\.sh$|deploy/build-python-source$|deploy/exchequer-cli-formula$|deploy/exchequer-cli\.rb\.template$|deploy/tests/cli-formula-smoke\.sh$')"
          } >> "$GITHUB_OUTPUT"

  # The Rust server: format, lints, licenses, tests, backup round trip.
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          # A throwaway database that only the job can reach: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The justfile's database settings point here instead of server/.pgdata.
      EXCHEQUER_PGHOST: localhost
      EXCHEQUER_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Postgres 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Install sqlx-cli
        working-directory: server
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Apply migrations
        working-directory: server
        run: cargo sqlx migrate run -D postgres://exchequer@localhost/exchequer
      - run: just check

  # Both container images, built as the release builds them, and smoke-tested.
  image:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          POSTGRES_USER: exchequer
          POSTGRES_DB: exchequer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchequer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: echo "VERSION=$(deploy/version)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The server image's layers, the compiled dependencies above all, kept in
      # GitHub's cache. Every workflow reads and writes one scope; a tag can read
      # what main wrote.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: exchequer-server
          build-args: EXCHEQUER_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=exchequer-server
          cache-to: type=gha,mode=max,scope=exchequer-server
      - name: Build the backup image
        run: docker build -f deploy/backup.Containerfile -t exchequer-backup deploy
      - name: Smoke test
        run: deploy/tests/image-smoke.sh exchequer-server exchequer-backup

  # The web app: lint, types, tests, licences, build, and the generated API
  # types matching api/openapi.json.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: just web-check

  # The Python workspace: lint, types, tests, licences, and the generated SDK
  # matching api/openapi.json.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just
      - run: just python-check

  # The CLI's Debian package, as the release builds it, installed on Debian 13.
  deb:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: deploy/tests/cli-deb-smoke.sh "$(deploy/build-cli-deb)"

  # The CLI's Homebrew formula, installed from a tarball of this commit.
  brew:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: deploy/tests/cli-formula-smoke.sh

  # The one required check: every job above succeeded or was skipped (its area
  # didn't change). Runs even when one failed, so a failure blocks the merge
  # instead of leaving the check missing.
  gate:
    if: always()
    needs: [changes, server, image, web, python, deb, brew]
    runs-on: ubuntu-24.04
    steps:
      - env:
          OK: ${{ needs.changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: test "$OK" = true
