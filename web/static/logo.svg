<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 2 64 64">
	<title>Exchequer</title>
	<!-- The favicon, the app's brand (Brand.svelte) and the README's logo; the light
	     look is rendered to apple-touch-icon.png. Colors are the accent and chart gold
	     of tokens.css, light and dark. -->
	<style>
		.pig { fill: #1f5f4a; }
		.tail { fill: none; stroke: #1f5f4a; }
		.coin { fill: #b7791f; }
		@media (prefers-color-scheme: dark) {
			.pig { fill: #5cb595; }
			.tail { stroke: #5cb595; }
			.coin { fill: #e0a84a; }
		}
	</style>
	<defs>
		<path id="near-ear" d="M38.5 27.5 C39.5 21.5 42.5 17.5 46.5 18 C47.5 21.5 47 25.5 45.2 29 Z" />
		<rect id="near-front-leg" x="36" y="45" width="7.5" height="12" rx="2.5" />
		<rect id="near-back-leg" x="17" y="45" width="7.5" height="12" rx="2.5" />
		<ellipse id="snout" cx="54" cy="38" rx="3.75" ry="6.25" />
	</defs>
	<!-- The far ear and legs, kept apart from the near ones by a thin gap. -->
	<mask id="behind">
		<rect width="64" height="64" fill="#fff" />
		<g fill="#000" stroke="#000" stroke-width="3">
			<use href="#near-ear" />
			<use href="#near-front-leg" />
			<use href="#near-back-leg" />
		</g>
	</mask>
	<!-- The coin slot, the eye, and the snout's end with its nostrils. -->
	<mask id="cuts">
		<rect width="64" height="64" fill="#fff" />
		<rect x="18" y="27" width="14" height="3.5" rx="1.75" fill="#000" />
		<circle cx="42" cy="33" r="2" fill="#000" />
		<use href="#snout" fill="none" stroke="#000" stroke-width="1.25" />
		<ellipse cx="52.8" cy="38" rx="0.75" ry="1.6" fill="#000" />
		<ellipse cx="55.2" cy="38" rx="0.75" ry="1.6" fill="#000" />
	</mask>
	<clipPath id="above-slot">
		<rect width="64" height="28.75" />
	</clipPath>
	<g class="pig" mask="url(#behind)">
		<path d="M33.5 27.5 C34 22 35.5 18.5 38.5 18 C40 21.5 40 25 39 28 Z" />
		<rect x="11.5" y="44" width="7" height="11" rx="2.5" />
		<rect x="30.5" y="44" width="7" height="11" rx="2.5" />
	</g>
	<g class="pig" mask="url(#cuts)">
		<ellipse cx="30" cy="38" rx="21" ry="15" />
		<rect x="45" y="32" width="9" height="12" rx="3" />
		<use href="#snout" />
		<use href="#near-ear" />
		<use href="#near-front-leg" />
		<use href="#near-back-leg" />
	</g>
	<path class="tail" d="M9.5 34.5 C6 35.5 3.5 33 4.5 30.5 C5.5 28 9 28.8 8.3 31.2" stroke-width="2.5" stroke-linecap="round" />
	<g clip-path="url(#above-slot)">
		<circle class="coin" cx="25" cy="20" r="8.5" />
		<circle cx="25" cy="20" r="5.75" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="1.25" />
	</g>
</svg>
