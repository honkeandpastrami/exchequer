# Money is never a float (design §3.5). The ban is a guard for money, not a ban on
# floats as such: non-money code that needs one (a similarity score, a confidence)
# opts out locally with #[expect(..., reason = ...)], and the `suggest-local-ai` crate as
# a whole. A float must never become stored data.
disallowed-types = [
    { path = "f32", reason = "no floating point: use ledger::Amount or ledger::Rate" },
    { path = "f64", reason = "no floating point: use ledger::Amount or ledger::Rate" },
]
