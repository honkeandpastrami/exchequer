[package]
name = "store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Postgres access and schema migrations (design §15)"

[lints]
workspace = true

[dependencies]
domain = { version = "0.0.0", path = "../domain" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "uuid", "time", "rust_decimal", "derive", "json"] }
time = "0.3.55"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
