[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The exchequer-server binary: configuration, startup, wiring"

[[bin]]
name = "exchequer-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
api = { path = "../api" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
heuristics = { path = "../heuristics" }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
store = { path = "../store" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
