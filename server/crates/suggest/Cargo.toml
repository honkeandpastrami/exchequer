[package]
name = "suggest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Suggestions (design §8): the interface every suggester implements, the stack that combines them, and the backtest that measures them"

[lints]
workspace = true

[dependencies]
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
time = "0.3.55"
uuid = "1.28.0"

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
