[package]
name = "api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP API: handlers, auth middleware, OpenAPI (design §5, §10)"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
domain = { version = "0.0.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
store = { version = "0.0.0", path = "../store" }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
