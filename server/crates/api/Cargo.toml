[package]
name = "api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP API: handlers, auth middleware, OpenAPI (design §5, §10)"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
domain = { version = "0.0.0", path = "../domain" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "postgres"] }
store = { version = "0.0.0", path = "../store" }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["time", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
