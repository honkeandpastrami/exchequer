[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# A placeholder: builds take their version from git tags (deploy/version).
version = "0.0.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

# Money is never floating point (docs/design.md §3.5). Only the future
# `heuristics` crate may opt out of these lints.
[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
disallowed_types = "deny"
