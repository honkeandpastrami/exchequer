[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The one version of everything in this repo: `just set-version X.Y.Z`.
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false

# Money is never floating point (docs/design.md §3.5). Only the future
# `heuristics` crate may opt out of these lints.
[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
disallowed_types = "deny"
