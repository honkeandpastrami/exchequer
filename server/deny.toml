# cargo-deny: `cargo deny check` (part of `just check`). Design §16.4: the
# project is BSD-2-Clause, so no GPL dependencies.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates (RustSec) fail the check.
# Each ignore says why it doesn't apply; remove it once the fix is upgraded in.
ignore = [
    # quick-xml 0.39 via ofx-rs 0.2.0 (newest). ofx-rs never calls
    # `BytesStart::attributes()`, the affected path. Drop both once ofx-rs
    # moves to quick-xml >= 0.41.
    { id = "RUSTSEC-2026-0194", reason = "ofx-rs doesn't iterate attributes" },
    # Same crate; only `NsReader` is affected, and ofx-rs uses the plain `Reader`.
    { id = "RUSTSEC-2026-0195", reason = "ofx-rs doesn't use NsReader" },
    # smartstring via Rhai (the rules engine, design §8): unmaintained, not
    # vulnerable, and Rhai can't do without it. Revisit when Rhai drops it.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained only; required by rhai" },
]

[licenses]
# Permissive licenses only. A dependency offered under a choice of licenses
# passes when one of them is here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # ring, rustls-webpki, untrusted: TLS for remote AI (design §15).
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Each for named crates (design §16.4), none GPL: two pulled in by Rhai, one
# by the remote AI client, and passkeys' (webauthn-rs).
exceptions = [
    # MPL-2.0: copyleft per file, used unmodified from crates.io.
    { crate = "smartstring", allow = ["MPL-2.0"] },
    # CC0-1.0: a public-domain dedication (via ahash's compile-time seed).
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # CDLA-Permissive-2.0: Mozilla's root certificates as data, via ureq
    # (remote AI); the image has no system certificates.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # MPL-2.0: passkeys (design §10), used unmodified from crates.io.
    { crate = "webauthn-rs", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "base64urlsafedata", allow = ["MPL-2.0"] },
]

[licenses.private]
# Our own crates aren't published; their license is the repo's.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path only; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
